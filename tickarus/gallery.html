<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evening: The Fall of Day — a solar clock</title>
<style>
  :root {
    --ink: #eae4d6;
    --dim: #b9b3a2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vw 4vw 2vw;
    color: var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #12172b 0%, #3a2e4d 100%); /* static fallback until located */
    transition: background 3s ease;
    overflow-x: hidden;
  }

  .room {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    max-width: 100%;
  }

  /* -- frame, built from colors sampled off the actual photographed
     frame, rather than a generic gold border -- */
  .frame-outer {
    background: linear-gradient(135deg, #4a2c18 0%, #2a1710 45%, #150b06 100%);
    padding: clamp(12px, 2.1vw, 30px);
    border-radius: 2px;
    box-shadow:
      0 25px 70px rgba(0, 0, 0, 0.55),
      inset 0 0 0 2px rgba(0, 0, 0, 0.45),
      inset 0 2px 3px rgba(255, 255, 255, 0.08);
  }
  .frame-gold {
    background: linear-gradient(135deg, #e8c583 0%, #9c7530 50%, #6b4d1f 100%);
    padding: clamp(5px, 0.9vw, 13px);
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      inset 0 1px 2px rgba(255, 255, 255, 0.55),
      inset 0 -1px 2px rgba(0, 0, 0, 0.45);
  }

  .stage {
    position: relative;
    width: min(84vw, 860px);
    aspect-ratio: 2200 / 1728;
    overflow: hidden;
    background: #0c0c0c; /* shows briefly before the tint loads */
    display: block;
  }
  .stage > * { position: absolute; inset: 0; }

  .tint {
    background: linear-gradient(180deg, #12172b 0%, #3a2e4d 100%);
  }
  .artwork {
    width: 100%;
    height: 100%;
    object-fit: cover;
    mix-blend-mode: multiply;
    display: block;
  }

  .readout {
    inset: auto 5% 5% auto;
    text-align: right;
    pointer-events: none;
  }
  .readout .eyebrow {
    margin: 0;
    font-family: ui-serif, Georgia, serif;
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 237, 224, 0.75);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
  }
  .readout .time {
    margin: 0.15rem 0 0;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    font-size: clamp(1.15rem, 3vw, 1.9rem);
    letter-spacing: 0.03em;
    color: #f6f1e4;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.55);
  }

  figcaption {
    text-align: center;
    max-width: 34rem;
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--dim);
  }
  figcaption .title {
    font-style: italic;
    color: var(--ink);
  }
  figcaption .where {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <main class="room">
    <figure style="margin: 0;">
      <div class="frame-outer">
        <div class="frame-gold">
          <div class="stage" id="stage">
            <div class="tint" id="tint"></div>
            <picture>
              <source srcset="angel.webp" type="image/webp">
              <img class="artwork" src="angel.jpg"
                   alt="William Rimmer's Evening: The Fall of Day — a winged figure (Icarus) falling toward the sea at dusk">
            </picture>
            <div class="readout">
              <p class="eyebrow">solar time</p>
              <p class="time" id="clock">--:--:--</p>
            </div>
          </div>
        </div>
      </div>
      <figcaption>
        <span class="title">Evening: The Fall of Day</span> — William Rimmer, c. 1869–1870.
        Photographed from the drawing at the Museum of Fine Arts, Boston.
        <span class="where" id="where">locating…</span>
      </figcaption>
    </figure>
  </main>

  <script src="solarclock.js"></script>
  <script src="solarclock-weather.js"></script>
  <script src="solarclock-painting.js"></script>
  <script>
    var clockEl = document.getElementById('clock');
    var whereEl = document.getElementById('where');
    var tintEl = document.getElementById('tint');

    // One location lookup drives everything: the room's ambient
    // sky/weather (on <body>), the painting's gallery-lit tint, and
    // the clock reading.
    SolarClock.getLocation().then(function (loc) {
      if (!loc) {
        whereEl.textContent = 'Location unavailable — showing the clock without it.';
        return;
      }
      var src = loc.source === 'gps' ? 'precise location' : 'approximate, via IP';
      var place = loc.city ? loc.city + ' — ' : '';
      whereEl.textContent = place + loc.lat.toFixed(2) + ', ' + loc.lon.toFixed(2) + ' (' + src + ')';

      SolarClock.attach(clockEl, { lat: loc.lat, lon: loc.lon });
      SolarClock.attachSky(document.body, { lat: loc.lat, lon: loc.lon });
      SolarClock.attachWeatherFX(document.body, { lat: loc.lat, lon: loc.lon });
      SolarClock.attachPaintingTint(tintEl, { lat: loc.lat, lon: loc.lon, minLightness: 0.22 });
    });
  </script>
</body>
</html>
