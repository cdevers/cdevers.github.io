<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evening: The Fall of Day — a solar clock</title>
<style>
  :root {
    --wall: #f4f1ea;
    --ink: #2b2620;
    --dim: #6b6355;
    --serif: "Caslon", "Big Caslon", "Adobe Caslon Pro", Garamond, "EB Garamond", "Times New Roman", Times, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #17140f;
      --ink: #eae4d6;
      --dim: #b9b3a2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vw 4vw 2vw;
    color: var(--ink);
    font-family: var(--serif);
    background: var(--wall); /* a plain gallery wall -- no longer time/weather driven */
    overflow-x: hidden;
  }

  .room {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    max-width: 100%;
  }

  /* -- frame, built from colors sampled off the actual photographed
     frame, rather than a generic gold border -- */
  .frame-outer {
    background: linear-gradient(135deg, #4a2c18 0%, #2a1710 45%, #150b06 100%);
    padding: clamp(12px, 2.1vw, 30px);
    border-radius: 2px;
    box-shadow:
      0 25px 70px rgba(0, 0, 0, 0.55),
      inset 0 0 0 2px rgba(0, 0, 0, 0.45),
      inset 0 2px 3px rgba(255, 255, 255, 0.08);
  }
  .frame-gold {
    background: linear-gradient(135deg, #e8c583 0%, #9c7530 50%, #6b4d1f 100%);
    padding: clamp(5px, 0.9vw, 13px);
    box-shadow:
      inset 0 0 0 1px rgba(0, 0, 0, 0.35),
      inset 0 1px 2px rgba(255, 255, 255, 0.55),
      inset 0 -1px 2px rgba(0, 0, 0, 0.45);
  }

  .stage {
    position: relative;
    width: min(84vw, 860px);
    aspect-ratio: 2200 / 1728;
    overflow: hidden;
    background: #0c0c0c; /* shows briefly before the tint loads */
    display: block;
  }
  .stage > * { position: absolute; inset: 0; }

  .sky-weather {
    /* holds the tint gradient + the weather-fx layer; the artwork
       (next sibling) multiplies against this whole composite, so
       weather stays confined to the frame instead of the page */
    overflow: hidden;
  }
  .tint {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #12172b 0%, #3a2e4d 100%);
  }
  .artwork {
    width: 100%;
    height: 100%;
    object-fit: cover;
    mix-blend-mode: multiply;
    display: block;
  }

  .readout {
    inset: 5% auto auto 5%;
    text-align: left;
    pointer-events: none;
  }
  .readout .eyebrow {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(242, 237, 224, 0.8);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
  }
  .readout .time {
    margin: 0.15rem 0 0;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums; /* keeps digit widths steady without a monospace font */
    font-size: clamp(1.15rem, 3vw, 1.9rem);
    letter-spacing: 0.02em;
    color: #f6f1e4;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 0, 0, 0.55);
  }
  /* toggled by JS from the current sky brightness, so the readout
     stays legible against both a dark night sky and a pale daytime one */
  .readout.on-light .eyebrow {
    color: rgba(40, 34, 26, 0.8);
    text-shadow: 0 1px 4px rgba(255, 255, 255, 0.85);
  }
  .readout.on-light .time {
    color: #1e1a14;
    text-shadow: 0 1px 4px rgba(255, 255, 255, 0.85), 0 0 20px rgba(255, 255, 255, 0.5);
  }

  figcaption {
    text-align: center;
    max-width: 34rem;
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--dim);
  }
  figcaption .title {
    font-style: italic;
    color: var(--ink);
  }
  figcaption .where {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.78rem;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <main class="room">
    <figure style="margin: 0;">
      <div class="frame-outer">
        <div class="frame-gold">
          <div class="stage" id="stage">
            <div class="sky-weather" id="sky-weather">
              <div class="tint" id="tint"></div>
              <!-- weather effects (clouds/rain/snow/stars/moon) are inserted
                   here by SolarClock.attachWeatherFX, so they sit under the
                   artwork and get multiplied along with the tint -->
            </div>
            <picture>
              <source srcset="angel.webp" type="image/webp">
              <img class="artwork" src="angel.jpg"
                   alt="William Rimmer's Evening: The Fall of Day — a winged figure (Icarus) falling toward the sea at dusk">
            </picture>
            <div class="readout">
              <p class="eyebrow">solar time</p>
              <p class="time" id="clock">--:--:--</p>
            </div>
          </div>
        </div>
      </div>
      <figcaption>
        <span class="title">Evening: The Fall of Day</span> — William Rimmer, c. 1869–1870.
        Photographed from the drawing at the Museum of Fine Arts, Boston.
        <span class="where" id="where">locating…</span>
      </figcaption>
    </figure>
  </main>

  <script src="solarclock.js"></script>
  <script src="solarclock-weather.js"></script>
  <script src="solarclock-painting.js"></script>
  <script src="solarclock-celestial.js"></script>
  <script>
    var clockEl = document.getElementById('clock');
    var whereEl = document.getElementById('where');
    var tintEl = document.getElementById('tint');
    var readoutEl = document.querySelector('.readout');

    function luminanceOfRgbString(rgbStr) {
      var m = /rgb\((\d+),\s*(\d+),\s*(\d+)\)/.exec(rgbStr);
      if (!m) return 255;
      var r = +m[1], g = +m[2], b = +m[3];
      return (r * 299 + g * 587 + b * 114) / 1000;
    }

    // One location lookup drives everything: the painting's gallery-lit
    // tint, the weather layer confined to the frame, the sun/moon, and
    // the clock reading. The wall around the frame is a static, theme-
    // aware color (see the :root / prefers-color-scheme rules above) --
    // no longer tied to time of day.
    SolarClock.getLocation().then(function (loc) {
      if (!loc) {
        whereEl.textContent = 'Location unavailable — showing the clock without it.';
        return;
      }
      var src = loc.source === 'gps' ? 'precise location' : 'approximate, via IP';
      var place = loc.city ? loc.city + ' — ' : '';
      whereEl.textContent = place + loc.lat.toFixed(2) + ', ' + loc.lon.toFixed(2) + ' (' + src + ')';

      SolarClock.attach(clockEl, { lat: loc.lat, lon: loc.lon });

      // Readout is in the top-left, over what's usually sky rather than
      // the water/reflection, so the *zenith* color (top of the gradient)
      // is the right proxy for "what's behind the text right now."
      SolarClock.attachPaintingTint(tintEl, {
        lat: loc.lat,
        lon: loc.lon,
        minLightness: 0.22,
        onUpdate: function (colors) {
          var light = luminanceOfRgbString(colors.zenith) > 150;
          readoutEl.classList.toggle('on-light', light);
        },
      });

      SolarClock.attachWeatherFX(document.getElementById('sky-weather'), {
        lat: loc.lat,
        lon: loc.lon,
      });

      // Sun by day, moon (with phase) by night, both positioned by real
      // elevation/azimuth -- see solarclock-celestial.js for the mapping.
      SolarClock.attachCelestial(document.getElementById('sky-weather'), {
        lat: loc.lat,
        lon: loc.lon,
      });
    });
  </script>
</body>
</html>
